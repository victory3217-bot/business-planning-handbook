<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 748" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">고객문제에서 가치제안·포지셔닝까지</title>
  <desc id="d">고객문제를 문제→속성→해법→제품·서비스로 정리하고, 경쟁재와 대체재를 고객문제 기준으로 파악한 뒤, 비교지표로 비교해 경쟁우위 7가지 기준으로 점검한다. 고객문제·해법·선택이유가 하나의 논리로 연결된 상태가 가치제안이며, 포지셔닝은 그 차이를 고객이 어떤 의미로 인식하게 할 것인가를 정하고 4P가 같은 방향을 지원하는지 점검한다.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="748" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="problem-to-product">
    <rect x="40" y="24" width="400" height="112" rx="10" fill="#315B62"/>
    <text x="240" y="51" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">문제 → 속성 → 해법 →</text>
    <text x="240" y="78" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">제품·서비스</text>
    <text x="240" y="101" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">특정 고객에게 필요한 기능과 성능을</text>
    <text x="240" y="124" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">선택하고 조합한다</text>
  </g>
  <g id="competing-alternatives">
    <rect x="40" y="168" width="400" height="96" rx="10" fill="#315B62"/>
    <text x="240" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">경쟁대안: 경쟁재 · 대체재</text>
    <text x="240" y="235" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">고객문제를 기준으로 범위를 정한다</text>
  </g>
  <g id="metrics-and-advantage">
    <rect x="40" y="296" width="400" height="136" rx="10" fill="#315B62"/>
    <text x="240" y="337" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">비교지표 → 경쟁우위</text>
    <text x="240" y="360" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">7가지 점검 기준</text>
    <text x="240" y="383" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">중요성·효율성·우월성·가시성</text>
    <text x="240" y="406" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">선점성·결정력·수익성</text>
  </g>
  <g id="value-proposition">
    <rect x="40" y="464" width="400" height="96" rx="10" fill="#C49A5A"/>
    <text x="240" y="496" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">가치제안</text>
    <text x="240" y="520" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">고객문제·해법·선택이유가</text>
    <text x="240" y="543" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">하나의 논리로 연결된 상태</text>
  </g>
  <g id="positioning">
    <rect x="40" y="592" width="400" height="132" rx="10" fill="#14253D"/>
    <text x="240" y="619" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">포지셔닝</text>
    <text x="240" y="643" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">차이를 고객이 어떤 의미로</text>
    <text x="240" y="666" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">인식하게 할 것인가</text>
    <text x="240" y="689" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">4P가 같은 방향을 지원하는지</text>
    <text x="240" y="712" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">점검한다</text>
  </g>
  <g id="flow">
    <line x1="240" y1="138" x2="240" y2="165" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="266" x2="240" y2="293" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="434" x2="240" y2="461" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="240" y1="562" x2="240" y2="589" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
</svg>
