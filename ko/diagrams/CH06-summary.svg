    <text x="28" y="42" font-size="16" font-weight="700" fill="#C49A5A">CH06 · 한 장 요약</text>
    <text x="28" y="72" font-size="21" font-weight="700" fill="#FFFFFF">원가·가격·수익모델을 설계한다</text>
  </g>
