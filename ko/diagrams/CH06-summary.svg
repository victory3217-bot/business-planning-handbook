    <text x="60" y="402" font-size="17" font-weight="700" fill="#14253D">채널·관계 비용</text>
    <text x="60" y="423" font-size="16" fill="#252A30">수수료·유통마진과 고객관계 비용을 가격구조</text>
    <text x="60" y="444" font-size="16" fill="#252A30">안에서 함께 본다</text>
  </g>
