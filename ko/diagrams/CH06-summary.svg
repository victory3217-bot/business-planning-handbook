    <circle cx="36" cy="117.5" r="13" fill="#C49A5A"/>
    <text x="36" y="123" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">1</text>
    <text x="60" y="123" font-size="17" font-weight="700" fill="#14253D">가격</text>
    <text x="60" y="144" font-size="16" fill="#252A30">마지막에 붙이는 숫자가 아니라 비즈니스모델</text>
    <text x="60" y="165" font-size="16" fill="#252A30">정합성의 기준이다</text>
  </g>
  <g id="point-2">
    <rect x="12" y="189" width="456" height="64" rx="10" fill="#FFFFFF"/>
    <circle cx="36" cy="210.5" r="13" fill="#C49A5A"/>
    <text x="36" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">2</text>
    <text x="60" y="216" font-size="17" font-weight="700" fill="#14253D">원가</text>
    <text x="60" y="237" font-size="16" fill="#252A30">활동을 나열해 추정하며 가격의 현실적 하한선이다</text>
  </g>
