    <text x="36" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">3</text>
    <text x="60" y="288" font-size="17" font-weight="700" fill="#14253D">가치와 경쟁</text>
    <text x="60" y="309" font-size="16" fill="#252A30">고객은 가치를 지불한다. 지불의사에서 원가를</text>
    <text x="60" y="330" font-size="16" fill="#252A30">역으로 검토하고, 경쟁가격은 같은 세그먼트</text>
    <text x="60" y="351" font-size="16" fill="#252A30">기준으로 본다</text>
  </g>
