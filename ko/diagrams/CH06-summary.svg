    <text x="60" y="495" font-size="17" font-weight="700" fill="#14253D">가격구조 점검</text>
    <text x="60" y="516" font-size="16" fill="#252A30">소비자가 = 실판매가 + 가격구간, 실판매가 =</text>
    <text x="60" y="537" font-size="16" fill="#252A30">총원가 + 이익. 비용률 합이 100%를 넘는지 보고</text>
    <text x="60" y="558" font-size="16" fill="#252A30">채널은 공헌이익으로 비교한다</text>
  </g>
  <g id="point-6">
    <rect x="12" y="582" width="456" height="85" rx="10" fill="#FFFFFF"/>
    <circle cx="36" cy="603.5" r="13" fill="#C49A5A"/>
    <text x="36" y="609" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">6</text>
    <text x="60" y="609" font-size="17" font-weight="700" fill="#14253D">수익모델</text>
    <text x="60" y="630" font-size="16" fill="#252A30">누가·무엇에·얼마를·언제·반복적으로</text>
    <text x="60" y="651" font-size="16" fill="#252A30">지불하는가, 그리고 가격 메커니즘</text>
  </g>
  <g id="point-7">
