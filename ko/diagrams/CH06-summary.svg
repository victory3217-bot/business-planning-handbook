    <circle cx="36" cy="696.5" r="13" fill="#C49A5A"/>
    <text x="36" y="702" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">7</text>
    <text x="60" y="702" font-size="17" font-weight="700" fill="#14253D">세 재무 렌즈</text>
    <text x="60" y="723" font-size="16" fill="#252A30">손익·자산·현금흐름으로 같은 사업의 다른 구조를</text>
    <text x="60" y="744" font-size="16" fill="#252A30">본다</text>
  </g>
  <g id="point-8">
    <rect x="12" y="768" width="456" height="85" rx="10" fill="#FFFFFF"/>
    <circle cx="36" cy="789.5" r="13" fill="#C49A5A"/>
    <text x="36" y="795" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">8</text>
    <text x="60" y="795" font-size="17" font-weight="700" fill="#14253D">넘기기</text>
    <text x="60" y="816" font-size="16" fill="#252A30">가격(P), 비용·마진 구조, 수익모델이 정리돼야</text>
    <text x="60" y="837" font-size="16" fill="#252A30">타당성 검증으로 간다</text>
  </g>
</svg>
