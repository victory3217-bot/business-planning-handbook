<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 865" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH06 한 장 요약: 원가·가격·수익모델</title>
  <desc id="d">CH06 원가·가격·수익모델을 설계한다의 핵심 정리를 8개 항목으로 압축한 한 장 요약. 1. 가격: 마지막에 붙이는 숫자가 아니라 비즈니스모델 정합성의 기준이다 2. 원가: 활동을 나열해 추정하며 가격의 현실적 하한선이다 3. 가치와 경쟁: 고객은 가치를 지불한다. 지불의사에서 원가를 역으로 검토하고, 경쟁가격은 같은 세그먼트 기준으로 본다 4. 채널·관계 비용: 수수료·유통마진과 고객관계 비용을 가격구조 안에서 함께 본다 5. 가격구조 점검: 소비자가 = 실판매가 + 가격구간, 실판매가 = 총원가 + 이익. 비용률 합이 100%를 넘는지 보고 채널은 공헌이익으로 비교한다 6. 수익모델: 누가·무엇에·얼마를·언제·반복적으로 지불하는가, 그리고 가격 메커니즘 7. 세 재무 렌즈: 손익·자산·현금흐름으로 같은 사업의 다른 구조를 본다 8. 넘기기: 가격(P), 비용·마진 구조, 수익모델이 정리돼야 타당성 검증으로 간다</desc>
  <g id="background">
    <rect width="480" height="865" rx="14" fill="#F6F2EA"/>
  </g>
