    <circle cx="36" cy="675.5" r="13" fill="#C49A5A"/>
    <text x="36" y="681" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">7</text>
    <text x="60" y="681" font-size="17" font-weight="700" fill="#14253D">확인 지표·근거 상태</text>
    <text x="60" y="702" font-size="16" fill="#252A30">로드맵에는 기간마다 확인 지표를, 위험에는 발동</text>
    <text x="60" y="723" font-size="16" fill="#252A30">조건과 대응을 붙인다. 오픈은 검증이 아니며</text>
    <text x="60" y="744" font-size="16" fill="#252A30">숫자에는 사실·가정·확인 필요를 표시한다</text>
  </g>
