    <text x="36" y="123" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">1</text>
    <text x="60" y="123" font-size="17" font-weight="700" fill="#14253D">실행</text>
    <text x="60" y="144" font-size="16" fill="#252A30">계획을 지키는 일이 아니라 계획이 현실과 어긋나는</text>
    <text x="60" y="165" font-size="16" fill="#252A30">곳을 찾는 가설검증이다</text>
  </g>
