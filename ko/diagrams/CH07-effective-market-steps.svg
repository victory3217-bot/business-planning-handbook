<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 708" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">유효시장 추정 9단계의 네 구간</title>
  <desc id="d">유효시장 추정 9단계는 네 구간으로 묶인다. 1~3단계에서 가설을 세우고, 4~5단계에서 QCD로 현실을 확인하며, 6~8단계에서 실행 가능한 모델로 좁히고, 9단계에서 유효시장을 가격×판매수량으로 표현한다. QCD 중 하나라도 충족되지 않으면 가설로 되돌아가고, 결과가 목표나 자원과 맞지 않으면 앞 단계로 돌아가 가설과 모델을 재조정한다.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="708" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="hypothesis">
    <rect x="40" y="24" width="380" height="104" rx="10" fill="#315B62"/>
    <text x="230" y="60" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">1~3단계 가설을 세운다</text>
    <text x="230" y="84" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">세분시장·타겟팅 → 포지셔닝</text>
    <text x="230" y="107" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">→ 유통·가격 가설</text>
  </g>
  <g id="qcd">
    <rect x="40" y="160" width="380" height="132" rx="10" fill="#C49A5A"/>
    <text x="230" y="187" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">4~5단계 QCD로 현실을 확인</text>
    <text x="230" y="211" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">품질(Quality)·비용(Cost)·</text>
    <text x="230" y="234" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">전달(Delivery)을 동시에 검토</text>
    <text x="230" y="257" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">하나라도 맞지 않으면</text>
    <text x="230" y="280" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">가설로 되돌아간다</text>
  </g>
  <g id="executable-model">
    <rect x="40" y="324" width="380" height="104" rx="10" fill="#315B62"/>
    <text x="230" y="360" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">6~8단계 실행 가능한 모델로</text>
    <text x="230" y="384" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">최종 타겟팅 → 최종 포지셔닝·4P</text>
    <text x="230" y="407" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">→ 최종 비즈니스모델(BMC)</text>
  </g>
  <g id="effective-market">
    <rect x="40" y="460" width="380" height="112" rx="10" fill="#14253D"/>
    <text x="230" y="489" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">9단계 유효시장을 숫자로 표현</text>
    <text x="230" y="512" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">가격(P) × 판매수량(Qty)</text>
    <text x="230" y="535" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">1~8단계에서 검증된</text>
    <text x="230" y="558" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">조건이 반영된 결과</text>
  </g>
  <g id="flow">
    <line x1="230" y1="130" x2="230" y2="157" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="230" y1="294" x2="230" y2="321" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="230" y1="430" x2="230" y2="457" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
  <g id="return-loop">
    <path d="M420 516 H452 V76 H422" fill="none" stroke="#C49A5A" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"/>
  </g>
  <g id="legend">
    <line x1="40" y1="612" x2="84" y2="612" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <text x="96" y="618" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">실선 화살표: 단계의 진행</text>
    <line x1="40" y1="652" x2="84" y2="652" stroke="#C49A5A" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"/>
    <text x="96" y="658" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">점선 화살표: 앞 단계로 돌아가</text>
    <text x="96" y="680" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">가설과 모델을 재조정</text>
  </g>
</svg>
