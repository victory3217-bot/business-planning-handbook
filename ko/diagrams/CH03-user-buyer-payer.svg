<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 430" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">사용자·구매자·지불자 구분</title>
  <desc id="d">사용자(User)는 실제로 문제를 겪는 사람, 구매자(Buyer)는 구매를 결정하는 사람, 지불자(Payer)는 비용을 지불하는 사람이다. B2C에서는 이 세 역할이 한 사람에게 모일 수 있고, B2B·B2G에서는 현장 사용자, 구매담당자, 예산승인자로 분리되는 경우가 많다.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="430" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="roles">
    <rect x="24" y="24" width="136" height="106" rx="10" fill="#14253D"/>
    <text x="92" y="53" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">사용자</text>
    <text x="92" y="75" text-anchor="middle" font-size="16" font-weight="400" fill="#F6F2EA">User</text>
    <text x="92" y="96" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">실제로 문제를</text>
    <text x="92" y="117" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">겪는 사람</text>
    <rect x="172" y="24" width="136" height="106" rx="10" fill="#14253D"/>
    <text x="240" y="53" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">구매자</text>
    <text x="240" y="75" text-anchor="middle" font-size="16" font-weight="400" fill="#F6F2EA">Buyer</text>
    <text x="240" y="96" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">구매를</text>
    <text x="240" y="117" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">결정하는 사람</text>
    <rect x="320" y="24" width="136" height="106" rx="10" fill="#14253D"/>
    <text x="388" y="53" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">지불자</text>
    <text x="388" y="75" text-anchor="middle" font-size="16" font-weight="400" fill="#F6F2EA">Payer</text>
    <text x="388" y="96" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">비용을</text>
    <text x="388" y="117" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">지불하는 사람</text>
  </g>
  <g id="b2c-converged">
    <text x="24" y="172" font-size="17" font-weight="700" fill="#252A30">B2C — 한 사람에게 모일 수 있다</text>
    <rect x="24" y="186" width="432" height="64" rx="10" fill="#FFFFFF" stroke="#C49A5A" stroke-width="4"/>
    <text x="240" y="225" text-anchor="middle" font-size="20" font-weight="700" fill="#14253D">사용자 · 구매자 · 지불자</text>
  </g>
  <g id="b2b-b2g-split">
    <text x="24" y="292" font-size="17" font-weight="700" fill="#252A30">B2B·B2G — 분리되는 경우가 많다</text>
    <rect x="24" y="306" width="136" height="96" rx="10" fill="#315B62"/>
    <text x="92" y="346" text-anchor="middle" font-size="16" font-weight="400" fill="#F6F2EA">사용자</text>
    <text x="92" y="372" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">현장 사용자</text>
    <rect x="172" y="306" width="136" height="96" rx="10" fill="#315B62"/>
    <text x="240" y="346" text-anchor="middle" font-size="16" font-weight="400" fill="#F6F2EA">구매자</text>
    <text x="240" y="372" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">구매담당자</text>
    <rect x="320" y="306" width="136" height="96" rx="10" fill="#315B62"/>
    <text x="388" y="346" text-anchor="middle" font-size="16" font-weight="400" fill="#F6F2EA">지불자</text>
    <text x="388" y="372" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">예산승인자</text>
  </g>
</svg>
