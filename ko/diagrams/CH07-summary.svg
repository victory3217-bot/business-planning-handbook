<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 844" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH07 한 장 요약: 사업타당성·유효시장</title>
  <desc id="d">CH07 사업타당성과 유효시장을 검증한다의 핵심 정리를 8개 항목으로 압축한 한 장 요약. 1. 사업타당성: 시장의 몇 %가 아니라 사업논리를 자원·비용의 제약에 대입해 보는 과정이다 2. 두 시장: 전체 시장과 유효시장은 다르다. Top-down과 Bottom-up을 함께 쓴다 3. 구매자 기준: 사용자가 아니라 구매자에 주목한다. B2C·B2B·B2G마다 Qty의 근거가 다르다 4. 9단계: 가설(1~3) → QCD(4~5) → 모델 확정(6~8) → 유효시장(9), 앞 단계로 되돌아가는 반복 5. QCD: 순서대로 통과하는 체크리스트가 아니라 동시에 충족해야 하는 조건이다 6. SOM과 SAM: 추정손익(SOM에 가까움)과 유효시장(SAM에 가까움)은 다른 질문이다 7. P의 기준: 구매자 지출 기준인지 우리 매출 기준인지 밝히고 한 문서 안에서 통일한다 8. 반복 검증: 예언이 아니라 논리적 증명. 가정이 바뀌면 다시 계산한다</desc>
  <g id="background">
    <rect width="480" height="844" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="header">
    <rect x="12" y="12" width="456" height="72" rx="12" fill="#14253D"/>
    <text x="28" y="42" font-size="16" font-weight="700" fill="#C49A5A">CH07 · 한 장 요약</text>
    <text x="28" y="72" font-size="21" font-weight="700" fill="#FFFFFF">사업타당성과 유효시장을 검증한다</text>
  </g>
  <g id="point-1">
    <rect x="12" y="96" width="456" height="85" rx="10" fill="#FFFFFF"/>
    <circle cx="36" cy="117.5" r="13" fill="#C49A5A"/>
    <text x="36" y="123" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">1</text>
    <text x="60" y="123" font-size="17" font-weight="700" fill="#14253D">사업타당성</text>
    <text x="60" y="144" font-size="16" fill="#252A30">시장의 몇 %가 아니라 사업논리를 자원·비용의</text>
    <text x="60" y="165" font-size="16" fill="#252A30">제약에 대입해 보는 과정이다</text>
  </g>
  <g id="point-2">
    <rect x="12" y="189" width="456" height="85" rx="10" fill="#FFFFFF"/>
    <circle cx="36" cy="210.5" r="13" fill="#C49A5A"/>
    <text x="36" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">2</text>
    <text x="60" y="216" font-size="17" font-weight="700" fill="#14253D">두 시장</text>
    <text x="60" y="237" font-size="16" fill="#252A30">전체 시장과 유효시장은 다르다. Top-down과</text>
    <text x="60" y="258" font-size="16" fill="#252A30">Bottom-up을 함께 쓴다</text>
  </g>
  <g id="point-3">
    <rect x="12" y="282" width="456" height="85" rx="10" fill="#FFFFFF"/>
    <circle cx="36" cy="303.5" r="13" fill="#C49A5A"/>
    <text x="36" y="309" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">3</text>
    <text x="60" y="309" font-size="17" font-weight="700" fill="#14253D">구매자 기준</text>
    <text x="60" y="330" font-size="16" fill="#252A30">사용자가 아니라 구매자에 주목한다.</text>
    <text x="60" y="351" font-size="16" fill="#252A30">B2C·B2B·B2G마다 Qty의 근거가 다르다</text>
  </g>
  <g id="point-4">
    <rect x="12" y="375" width="456" height="85" rx="10" fill="#FFFFFF"/>
    <circle cx="36" cy="396.5" r="13" fill="#C49A5A"/>
    <text x="36" y="402" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">4</text>
    <text x="60" y="402" font-size="17" font-weight="700" fill="#14253D">9단계</text>
    <text x="60" y="423" font-size="16" fill="#252A30">가설(1~3) → QCD(4~5) → 모델 확정(6~8) →</text>
    <text x="60" y="444" font-size="16" fill="#252A30">유효시장(9), 앞 단계로 되돌아가는 반복</text>
  </g>
  <g id="point-5">
    <rect x="12" y="468" width="456" height="85" rx="10" fill="#FFFFFF"/>
    <circle cx="36" cy="489.5" r="13" fill="#C49A5A"/>
    <text x="36" y="495" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">5</text>
    <text x="60" y="495" font-size="17" font-weight="700" fill="#14253D">QCD</text>
    <text x="60" y="516" font-size="16" fill="#252A30">순서대로 통과하는 체크리스트가 아니라 동시에</text>
    <text x="60" y="537" font-size="16" fill="#252A30">충족해야 하는 조건이다</text>
  </g>
  <g id="point-6">
    <rect x="12" y="561" width="456" height="85" rx="10" fill="#FFFFFF"/>
    <circle cx="36" cy="582.5" r="13" fill="#C49A5A"/>
    <text x="36" y="588" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">6</text>
    <text x="60" y="588" font-size="17" font-weight="700" fill="#14253D">SOM과 SAM</text>
    <text x="60" y="609" font-size="16" fill="#252A30">추정손익(SOM에 가까움)과 유효시장(SAM에</text>
    <text x="60" y="630" font-size="16" fill="#252A30">가까움)은 다른 질문이다</text>
  </g>
  <g id="point-7">
    <rect x="12" y="654" width="456" height="85" rx="10" fill="#FFFFFF"/>
    <circle cx="36" cy="675.5" r="13" fill="#C49A5A"/>
    <text x="36" y="681" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">7</text>
    <text x="60" y="681" font-size="17" font-weight="700" fill="#14253D">P의 기준</text>
    <text x="60" y="702" font-size="16" fill="#252A30">구매자 지출 기준인지 우리 매출 기준인지 밝히고</text>
    <text x="60" y="723" font-size="16" fill="#252A30">한 문서 안에서 통일한다</text>
  </g>
  <g id="point-8">
    <rect x="12" y="747" width="456" height="85" rx="10" fill="#FFFFFF"/>
    <circle cx="36" cy="768.5" r="13" fill="#C49A5A"/>
    <text x="36" y="774" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">8</text>
    <text x="60" y="774" font-size="17" font-weight="700" fill="#14253D">반복 검증</text>
    <text x="60" y="795" font-size="16" fill="#252A30">예언이 아니라 논리적 증명. 가정이 바뀌면 다시</text>
    <text x="60" y="816" font-size="16" fill="#252A30">계산한다</text>
  </g>
</svg>
