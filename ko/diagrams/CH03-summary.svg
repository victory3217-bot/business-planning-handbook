<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 751" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH03 한 장 요약: 고객·구매자·문제</title>
  <desc id="d">CH03 고객·구매자·문제를 정의한다의 핵심 정리를 7개 항목으로 압축한 한 장 요약. 1. 고객 정의: 명사가 아니라 시장의 이름·크기·경쟁구조·채널을 정하는 의사결정이다 2. 세 역할: 사용자·구매자·지불자는 같을 수도 다를 수도 있어 구분해야 한다 3. 구매논리: B2C는 개인의 불편·욕구, B2B는 조직성과, B2G는 예산·법령·조달방식 4. 세그먼트: 측정·접근·규모·역량 기준으로 반복해 좁히고, 공유된 문제로 다시 정의한다 5. 문제의 심각성: 존재만으로는 부족하다. 이상과 현실의 간극과 손실이 클수록 심각하다 6. 속성·KBF·접점: 현장의 말은 속성으로 번역하고, 구매요인과 접점으로 타깃을 구체화한다 7. 직접 확인: 바꿀 결정에서 거꾸로 질문을 만들어 사용자·구매자·영향자를 섞어 만난다</desc>
