    <text x="36" y="588" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">6</text>
    <text x="60" y="588" font-size="17" font-weight="700" fill="#14253D">속성·KBF·접점</text>
    <text x="60" y="609" font-size="16" fill="#252A30">현장의 말은 속성으로 번역하고, 구매요인과</text>
    <text x="60" y="630" font-size="16" fill="#252A30">접점으로 타깃을 구체화한다</text>
