    <circle cx="36" cy="210.5" r="13" fill="#C49A5A"/>
    <text x="36" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">2</text>
    <text x="60" y="216" font-size="17" font-weight="700" fill="#14253D">세 역할</text>
    <text x="60" y="237" font-size="16" fill="#252A30">사용자·구매자·지불자는 같을 수도 다를 수도</text>
    <text x="60" y="258" font-size="16" fill="#252A30">있어 구분해야 한다</text>
