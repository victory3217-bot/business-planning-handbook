    <text x="36" y="681" text-anchor="middle" font-size="16" font-weight="700" fill="#14253D">7</text>
    <text x="60" y="681" font-size="17" font-weight="700" fill="#14253D">직접 확인</text>
    <text x="60" y="702" font-size="16" fill="#252A30">바꿀 결정에서 거꾸로 질문을 만들어</text>
    <text x="60" y="723" font-size="16" fill="#252A30">사용자·구매자·영향자를 섞어 만난다</text>
  </g>
</svg>
