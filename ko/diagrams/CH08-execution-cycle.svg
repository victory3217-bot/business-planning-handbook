<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 848" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">실행의 다섯 가지 질문 순환</title>
  <desc id="d">실행은 다섯 가지 질문을 반복하는 순환으로 운영한다. 검증 전에는 가장 위험하거나 불확실한 가설을 정하고, 실행 설계에서는 감당 가능한 가장 작은 실행을 조사검증대상·측정지표·방법 및 계획으로 구체화하며, 검증 후에는 데이터가 가설을 지지했는지 수정하게 했는지 폐기하게 했는지 판단한다. 피보팅은 데이터가 기존 가설을 흔들었는지를 기준으로 하고, 지식축적에서 백데이터와 실행결과를 쌓은 뒤 다시 실행하면 다음 사이클이 시작된다.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="848" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="before-validation">
    <rect x="40" y="24" width="380" height="112" rx="10" fill="#315B62"/>
    <text x="230" y="64" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">검증 전</text>
    <text x="230" y="88" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">지금 가장 위험하거나 불확실한</text>
    <text x="230" y="111" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">가설은 무엇인가?</text>
  </g>
  <g id="design-execution">
    <rect x="40" y="168" width="380" height="112" rx="10" fill="#315B62"/>
    <text x="230" y="197" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">실행 설계</text>
    <text x="230" y="220" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">감당 가능한 가장 작은 실행은?</text>
    <text x="230" y="243" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">조사검증대상 · 측정지표 ·</text>
    <text x="230" y="266" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">방법 및 계획</text>
  </g>
  <g id="after-validation">
    <rect x="40" y="312" width="380" height="112" rx="10" fill="#315B62"/>
    <text x="230" y="352" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">검증 후</text>
    <text x="230" y="376" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">데이터는 가설을 지지했는가,</text>
    <text x="230" y="399" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">수정하게 했는가, 폐기하게 했는가?</text>
  </g>
  <g id="pivoting">
    <rect x="40" y="456" width="380" height="112" rx="10" fill="#C49A5A"/>
    <text x="230" y="485" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">피보팅</text>
    <text x="230" y="508" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">기준: 새 아이디어가 아니라</text>
    <text x="230" y="531" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">데이터가 가설을 흔들었는가</text>
    <text x="230" y="554" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">해당 가설을 다룬 앞 장을 다시 연다</text>
  </g>
  <g id="knowledge-accumulation">
    <rect x="40" y="600" width="380" height="112" rx="10" fill="#315B62"/>
    <text x="230" y="640" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">지식축적</text>
    <text x="230" y="664" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">백데이터와 실행결과를</text>
    <text x="230" y="687" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">어디에 축적해 다음에 쓸 것인가?</text>
  </g>
  <g id="flow">
    <line x1="230" y1="138" x2="230" y2="165" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="230" y1="282" x2="230" y2="309" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="230" y1="426" x2="230" y2="453" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="230" y1="570" x2="230" y2="597" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
  <g id="return-loop">
    <path d="M420 656 H452 V80 H422" fill="none" stroke="#C49A5A" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"/>
  </g>
  <g id="legend">
    <line x1="40" y1="752" x2="84" y2="752" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <text x="96" y="758" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">실선 화살표: 질문의 순서</text>
    <line x1="40" y1="792" x2="84" y2="792" stroke="#C49A5A" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"/>
    <text x="96" y="798" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">점선 화살표: 수정하고 다시 실행하면</text>
    <text x="96" y="820" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">다음 사이클이 시작된다</text>
  </g>
</svg>
