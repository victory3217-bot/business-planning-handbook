<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 712" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">Relationship between business criteria and subsequent decisions</title>
  <desc id="d">Business criteria consist of four criteria — lifestyle, target revenue, growth scale, and Not-to-do — brought together into a single priority system. This system works as a filter and an input in item selection and in the market, pricing, and feasibility review. The dashed arrow means the criteria are reopened when family circumstances, financial circumstances, role, or market environment change and the outcome the entrepreneur wants has changed.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="712" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="criteria">
    <rect x="40" y="24" width="400" height="72" rx="10" fill="#14253D"/>
    <text x="240" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Business Criteria</text>
    <text x="240" y="79" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">The entrepreneur's own judgment criteria</text>
  </g>
  <g id="criteria-items">
    <line x1="240" y1="96" x2="240" y2="120" stroke="#14253D" stroke-width="2.5"/>
    <rect x="40" y="120" width="192" height="52" rx="10" fill="#315B62"/>
    <text x="136" y="153" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Lifestyle</text>
    <rect x="248" y="120" width="192" height="52" rx="10" fill="#315B62"/>
    <text x="344" y="153" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Target revenue</text>
    <rect x="40" y="184" width="192" height="52" rx="10" fill="#315B62"/>
    <text x="136" y="217" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Growth scale</text>
    <rect x="248" y="184" width="192" height="52" rx="10" fill="#315B62"/>
    <text x="344" y="217" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Not-to-do</text>
  </g>
  <g id="priority-system">
    <line x1="240" y1="240" x2="240" y2="278" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <rect x="40" y="280" width="400" height="104" rx="10" fill="#C49A5A"/>
    <text x="240" y="316" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">Priority system</text>
    <text x="240" y="340" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">The entrepreneur decides what to</text>
    <text x="240" y="363" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">prioritize and what to give up</text>
  </g>
  <g id="downstream">
    <line x1="240" y1="384" x2="240" y2="420" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <text x="254" y="408" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Acts as a filter and input</text>
    <rect x="40" y="424" width="192" height="140" rx="10" fill="#315B62"/>
    <text x="136" y="480" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Item selection</text>
    <text x="136" y="503" text-anchor="middle" font-size="16" font-weight="400" fill="#F6F2EA">Not-to-do is</text>
    <text x="136" y="524" text-anchor="middle" font-size="16" font-weight="400" fill="#F6F2EA">used directly</text>
    <rect x="248" y="424" width="192" height="140" rx="10" fill="#315B62"/>
    <text x="344" y="456" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">Market, pricing,</text>
    <text x="344" y="481" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">feasibility review</text>
    <text x="344" y="504" text-anchor="middle" font-size="16" font-weight="400" fill="#F6F2EA">Business purpose and</text>
    <text x="344" y="525" text-anchor="middle" font-size="16" font-weight="400" fill="#F6F2EA">target revenue are</text>
    <text x="344" y="546" text-anchor="middle" font-size="16" font-weight="400" fill="#F6F2EA">preconditions</text>
  </g>
  <g id="reopen-loop">
    <path d="M440 494 H466 V60 H446" fill="none" stroke="#C49A5A" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"/>
  </g>
  <g id="legend">
    <line x1="40" y1="616" x2="84" y2="616" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <text x="96" y="622" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Solid arrow: input and filter for judgment</text>
    <line x1="40" y1="656" x2="84" y2="656" stroke="#C49A5A" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"/>
    <text x="96" y="662" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Dashed arrow: reopen the criteria when</text>
    <text x="96" y="684" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">circumstances or desired outcomes change</text>
  </g>
</svg>
