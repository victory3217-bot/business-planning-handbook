<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 956" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH07 One-Page Summary: Feasibility and Effective Market</title>
  <desc id="d">CH07 Validating Feasibility and the Effective Market: a one-page summary condensing the chapter's Key Takeaways into 8 points. 1. Business feasibility: Not a percentage of the total market but testing business logic against resource and cost constraints 2. Two markets: Total market and Effective Market differ; use Top-down and Bottom-up together 3. Buyer focus: Focus on the Buyer, not the User; the basis for Qty differs across B2C, B2B, and B2G 4. Nine steps: Hypothesis (1-3), QCD (4-5), model confirmation (6-8), Effective Market (9); loop back to earlier steps 5. QCD: Not a sequential checklist but conditions that must be satisfied simultaneously 6. SOM and SAM: Projected P&amp;L (close to SOM) and Effective Market (close to SAM) answer different questions 7. Basis of P: State whether P is buyer spending or our revenue, and keep it consistent within a document 8. Iterative validation: A logical proof, not a prophecy; recalculate whenever assumptions change</desc>
