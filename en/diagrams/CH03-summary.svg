<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 863" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH03 One-Page Summary: Customer, Buyer, and Problem</title>
  <desc id="d">CH03 Defining the Customer, the Buyer, and the Problem: a one-page summary condensing the chapter's Key Takeaways into 7 points. 1. Defining customers: Not a noun but a decision on the market's name, size, competitive structure, and channels 2. Three roles: User, Buyer, and Payer may be the same or different, so distinguish them 3. Buying logic: B2C: individual inconvenience or desire; B2B: organizational performance; B2G: budget, statutes, procurement 4. Segments: Narrow repeatedly by measurability, accessibility, scale, and capability; redefine by shared problem 5. Problem severity: Existence is not enough; the larger the gap and the resulting loss, the more severe 6. Attributes, KBF, touchpoints: Translate field language into attributes; sharpen the target with buying factors and touchpoints 7. Confirm firsthand: Work backward from the decision to change; meet users, buyers, and influencers</desc>
