<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 728" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH01 One-Page Summary: Setting the Criteria</title>
  <desc id="d">CH01 Setting the Criteria for Your Business: a one-page summary condensing the chapter's Key Takeaways into 6 points. 1. Starting point: Starts not from an item or a market, but from the entrepreneur's own judgment criteria 2. Success defined: Tied to lifestyle; needs priorities among autonomy, organization size, family, and social purpose 3. Target revenue: A constraint set before market size. Distinguish revenue from operating profit 4. Growth scale: Not an automatic goal but a strategic condition chosen by weighing the costs you accept 5. Not-to-do: Set before to-do, to focus limited resources on the core business 6. Review again: Bring the criteria into one priority system, and review it when circumstances change</desc>
