<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 751" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH05 One-Page Summary: Business Model</title>
  <desc id="d">CH05 Designing the Business Model: a one-page summary condensing the chapter's Key Takeaways into 7 points. 1. Operating logic: Creating, delivering, and making money from customer value, connected on three axes 2. Coherence: Over the completeness of each box, explain how one decision changes the other components 3. BMC structure: Value Proposition at center; delivery, creation, and capture connect around it 4. Connecting sentences: The BMC maps causal relationships; connecting sentences expose logical conflicts 5. T-Canvas and Story: The T-Canvas links market and product risk; the Story re-checks through buying logic 6. Cases and benchmarking: Read others' models with the same boxes; copying one box conflicts with the rest 7. Meaning of complete: Not success, but ready to move on to cost, price, and feasibility validation</desc>
