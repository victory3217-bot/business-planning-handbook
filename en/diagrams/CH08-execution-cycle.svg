<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 848" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">The five-question execution cycle</title>
  <desc id="d">Execution runs as a cycle of five repeated questions. Before validation, identify the riskiest or most uncertain hypothesis; in execution design, specify the smallest affordable action through what to investigate, the metrics, and the method and plan; after validation, judge whether the data supported, revised, or discarded the hypothesis. Pivoting is judged by whether the data shook the existing hypothesis, and after knowledge accumulation stores the back data and results, executing again starts the next cycle.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14253D"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C49A5A"/>
    </marker>
  </defs>
  <g id="background">
    <rect width="480" height="848" rx="14" fill="#F6F2EA"/>
  </g>
  <g id="before-validation">
    <rect x="40" y="24" width="380" height="112" rx="10" fill="#315B62"/>
    <text x="230" y="64" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Before Validation</text>
    <text x="230" y="88" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">What is the riskiest or most</text>
    <text x="230" y="111" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">uncertain hypothesis right now?</text>
  </g>
  <g id="design-execution">
    <rect x="40" y="168" width="380" height="112" rx="10" fill="#315B62"/>
    <text x="230" y="197" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Design the Execution</text>
    <text x="230" y="220" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">What is the smallest affordable action?</text>
    <text x="230" y="243" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">What to investigate, metrics,</text>
    <text x="230" y="266" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">method and plan</text>
  </g>
  <g id="after-validation">
    <rect x="40" y="312" width="380" height="112" rx="10" fill="#315B62"/>
    <text x="230" y="352" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">After Validation</text>
    <text x="230" y="376" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Did the data support, revise,</text>
    <text x="230" y="399" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">or discard the hypothesis?</text>
  </g>
  <g id="pivoting">
    <rect x="40" y="456" width="380" height="112" rx="10" fill="#C49A5A"/>
    <text x="230" y="485" text-anchor="middle" font-size="20" font-weight="700" fill="#252A30">Pivoting</text>
    <text x="230" y="508" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">Basis: did the data shake the</text>
    <text x="230" y="531" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">existing hypothesis, not a new idea?</text>
    <text x="230" y="554" text-anchor="middle" font-size="17" font-weight="400" fill="#252A30">Reopen the chapter on that hypothesis</text>
  </g>
  <g id="knowledge-accumulation">
    <rect x="40" y="600" width="380" height="112" rx="10" fill="#315B62"/>
    <text x="230" y="640" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Knowledge Accumulation</text>
    <text x="230" y="664" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">Where will you store back data and</text>
    <text x="230" y="687" text-anchor="middle" font-size="17" font-weight="400" fill="#F6F2EA">results for the next decision?</text>
  </g>
  <g id="flow">
    <line x1="230" y1="138" x2="230" y2="165" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="230" y1="282" x2="230" y2="309" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="230" y1="426" x2="230" y2="453" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <line x1="230" y1="570" x2="230" y2="597" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
  </g>
  <g id="return-loop">
    <path d="M420 656 H452 V80 H422" fill="none" stroke="#C49A5A" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"/>
  </g>
  <g id="legend">
    <line x1="40" y1="752" x2="84" y2="752" stroke="#14253D" stroke-width="2.5" marker-end="url(#arrow-navy)"/>
    <text x="96" y="758" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Solid arrow: order of the questions</text>
    <line x1="40" y1="792" x2="84" y2="792" stroke="#C49A5A" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow-gold)"/>
    <text x="96" y="798" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">Dashed arrow: revise and execute again</text>
    <text x="96" y="820" text-anchor="start" font-size="16" font-weight="400" fill="#252A30">to start the next cycle</text>
  </g>
</svg>
