<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1028" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH08 One-Page Summary: Execute, Validate, Pivot</title>
  <desc id="d">CH08 Execute, Validate, and Revise Through Pivoting: a one-page summary condensing the chapter's Key Takeaways into 9 points. 1. Execution: Not sticking to the plan but hypothesis testing that finds where the plan diverges from reality 2. Plan vs. document: The plan is a structure of connected hypotheses; the document is a byproduct of back data 3. Four validation elements: Connect what to investigate, metrics, method and plan, and feedback data 4. Good experiment: Small, repeatable, within affordable risk, and makes the next decision more accurate 5. Pivoting: Judged not by a new idea but by whether the data shook the existing hypothesis 6. Strategy and numbers: Strategy translates the model into time, activities, resources, and cost; revise if numbers conflict 7. Back data and Master Plan: Accumulate the evidence for your judgments as you go 8. AI and people: AI is a supporting layer; taking on risk and final decisions remain human 9. Learning cycle: Execution data shows which earlier chapter to reopen, making this an ongoing learning cycle</desc>
