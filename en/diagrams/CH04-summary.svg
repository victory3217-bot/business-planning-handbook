<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 821" role="img" aria-labelledby="t d" font-family="system-ui, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title id="t">CH04 One-Page Summary: Value Proposition and Positioning</title>
  <desc id="d">CH04 Building Value Proposition, Advantage, and Positioning: a one-page summary condensing the chapter's Key Takeaways into 7 points. 1. What customers buy: Not the technology but the outcome it solves 2. Competitive scope: Set by the customer problem, not product category; consider competitors and substitutes together 3. Comparison metrics: A competitiveness claim must be verifiable against the customer's purchase-decision criteria 4. Evidence over claims: Replace claims of superiority or no competitors with figures and firsthand evidence 5. Competitive advantage: A difference that moves the customer's choice and that the company can deliver repeatedly 6. Value proposition: Customer problem, solution, and reason for choice in one connected logic 7. Positioning: Check that product, price, channel, and communication point the same way</desc>
